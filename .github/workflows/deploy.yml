name: Deploy ML Monitoring Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest boto3

      - name: Run unit tests
        run: pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Build Lambda packages
        run: sam build --template-file infrastructure/template.yaml

      - name: Deploy with SAM
        run: |
          sam deploy \
            --stack-name ml-monitoring-pipeline \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides AlertEmail=mansican908@gmail.com \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset \
            --resolve-s3 \
            --s3-prefix ml-monitoring-pipeline \
            --region us-east-1

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ml-monitoring-pipeline \
            --query 'Stacks[0].Outputs' \
            --output table
