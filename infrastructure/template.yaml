AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'ML Model Monitoring Pipeline - CSCI 5411 Term Project (Full Feature Set)'

Parameters:
  AlertEmail:
    Type: String
    Default: 'mansican908@gmail.com'
    Description: Email address for drift and anomaly alerts
  LabRoleArn:
    Type: String
    Default: 'arn:aws:iam::494164398539:role/LabRole'
    Description: Pre-existing AWS Academy LabRole (IAM role creation restricted in Learner Lab)

Resources:

  # ═══════════════════════════════════════════════════════════
  # STORAGE
  # ═══════════════════════════════════════════════════════════

  PredictionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ml-predictions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: model_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: model_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: IdIndex
          KeySchema:
            - AttributeName: id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ModelConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ml-model-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: model_id
          AttributeType: S
      KeySchema:
        - AttributeName: model_id
          KeyType: HASH

  GroundTruthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ml-ground-truth
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: prediction_id
          AttributeType: S
      KeySchema:
        - AttributeName: prediction_id
          KeyType: HASH

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ml-monitoring-reports-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldReports
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER

  # ═══════════════════════════════════════════════════════════
  # KINESIS DATA STREAMS (high-volume ingestion path)
  # ═══════════════════════════════════════════════════════════

  PredictionsStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: ml-predictions-stream
      ShardCount: 1
      RetentionPeriodHours: 24

  # ═══════════════════════════════════════════════════════════
  # ALERTING
  # ═══════════════════════════════════════════════════════════

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ml-drift-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # ═══════════════════════════════════════════════════════════
  # IAM NOTE
  # AWS Academy restricts iam:CreateRole. We use the pre-existing
  # LabRole. In production, a least-privilege role would be created
  # per Lambda with only the permissions each function needs.
  # ═══════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════
  # LAMBDA FUNCTIONS
  # All function code lives in ../src/<name>/handler.py — this is
  # the single source of truth that is also exercised by tests/.
  # ═══════════════════════════════════════════════════════════

  IngestorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-prediction-ingestor
      CodeUri: ../src/ingestor/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref PredictionsTable
          KINESIS_STREAM_NAME: !Ref PredictionsStream

  DriftDetectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-drift-detector
      CodeUri: ../src/drift_detector/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 120
      Environment:
        Variables:
          TABLE_NAME: !Ref PredictionsTable
          SNS_TOPIC_ARN: !Ref AlertTopic
          CONFIDENCE_THRESHOLD: '0.75'
          MODEL_CONFIG_TABLE: !Ref ModelConfigTable
          STATE_MACHINE_ARN: !Ref DriftResponseStateMachine

  AnomalyDetectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-anomaly-detector
      CodeUri: ../src/anomaly_detector/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref PredictionsTable
          SNS_TOPIC_ARN: !Ref AlertTopic

  ReportGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-report-generator
      CodeUri: ../src/report_generator/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 120
      Environment:
        Variables:
          TABLE_NAME: !Ref PredictionsTable
          BUCKET_NAME: !Ref ReportsBucket

  KinesisProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-kinesis-processor
      CodeUri: ../src/kinesis_processor/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref PredictionsTable

  GroundTruthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-ground-truth
      CodeUri: ../src/ground_truth/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref PredictionsTable
          GROUND_TRUTH_TABLE: !Ref GroundTruthTable

  ModelConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-model-config
      CodeUri: ../src/model_config/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 30
      Environment:
        Variables:
          MODEL_CONFIG_TABLE: !Ref ModelConfigTable

  DriftResponderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-drift-responder
      CodeUri: ../src/drift_responder/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 30
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AlertTopic
          TABLE_NAME: !Ref PredictionsTable

  AccuracyPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-accuracy-publisher
      CodeUri: ../src/accuracy_publisher/
      Runtime: python3.11
      Handler: handler.handler
      Role: !Ref LabRoleArn
      Timeout: 60
      Environment:
        Variables:
          GROUND_TRUTH_TABLE: !Ref GroundTruthTable

  # ═══════════════════════════════════════════════════════════
  # KINESIS → LAMBDA TRIGGER
  # ═══════════════════════════════════════════════════════════

  KinesisEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt PredictionsStream.Arn
      FunctionName: !GetAtt KinesisProcessorFunction.Arn
      StartingPosition: LATEST
      BatchSize: 100

  # ═══════════════════════════════════════════════════════════
  # STEP FUNCTIONS — Automated Drift Response Workflow
  # ═══════════════════════════════════════════════════════════

  DriftResponseStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ml-drift-response-workflow
      RoleArn: !Ref LabRoleArn
      Definition:
        Comment: "Automated drift response — check, escalate, or resolve"
        StartAt: CheckDrift
        States:
          CheckDrift:
            Type: Task
            Resource: !GetAtt DriftResponderFunction.Arn
            Parameters:
              model_id.$: "$.model_id"
              stage: "check"
              drift_hours.$: "$.drift_hours"
            ResultPath: "$.result"
            Next: IsDriftResolved
          IsDriftResolved:
            Type: Choice
            Choices:
              - Variable: "$.result.still_drifting"
                BooleanEquals: false
                Next: ResolveDrift
            Default: EscalateDrift
          EscalateDrift:
            Type: Task
            Resource: !GetAtt DriftResponderFunction.Arn
            Parameters:
              model_id.$: "$.model_id"
              stage: "escalate"
              drift_hours.$: "$.result.drift_hours"
            Next: WaitBeforeRecheck
          WaitBeforeRecheck:
            Type: Wait
            Seconds: 3600
            Next: CheckDrift
          ResolveDrift:
            Type: Task
            Resource: !GetAtt DriftResponderFunction.Arn
            Parameters:
              model_id.$: "$.model_id"
              stage: "resolve"
              drift_hours.$: "$.result.drift_hours"
            End: true

  # ═══════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════

  MonitoringAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: ml-monitoring-api
      Description: ML Model Monitoring — predictions, ground truth, model config

  # /predictions
  PredictionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringAPI
      ParentId: !GetAtt MonitoringAPI.RootResourceId
      PathPart: predictions

  PredictionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MonitoringAPI
      ResourceId: !Ref PredictionsResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestorFunction.Arn}/invocations'

  # /ground-truth
  GroundTruthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringAPI
      ParentId: !GetAtt MonitoringAPI.RootResourceId
      PathPart: ground-truth

  GroundTruthMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MonitoringAPI
      ResourceId: !Ref GroundTruthResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GroundTruthFunction.Arn}/invocations'

  # /models/{model_id}/config
  ModelsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringAPI
      ParentId: !GetAtt MonitoringAPI.RootResourceId
      PathPart: models

  ModelIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringAPI
      ParentId: !Ref ModelsResource
      PathPart: '{model_id}'

  ModelConfigResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringAPI
      ParentId: !Ref ModelIdResource
      PathPart: config

  ModelConfigGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MonitoringAPI
      ResourceId: !Ref ModelConfigResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ModelConfigFunction.Arn}/invocations'

  ModelConfigPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MonitoringAPI
      ResourceId: !Ref ModelConfigResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ModelConfigFunction.Arn}/invocations'

  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PredictionsMethod
      - GroundTruthMethod
      - ModelConfigGetMethod
      - ModelConfigPostMethod
    Properties:
      RestApiId: !Ref MonitoringAPI
      StageName: prod

  # ── API Key + Usage Plan ───────────────────────────────────

  MonitoringAPIKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: APIDeployment
    Properties:
      Name: ml-monitoring-api-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref MonitoringAPI
          StageName: prod

  MonitoringUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: APIDeployment
    Properties:
      UsagePlanName: ml-monitoring-usage-plan
      Throttle:
        RateLimit: 100
        BurstLimit: 200
      Quota:
        Limit: 10000
        Period: DAY
      ApiStages:
        - ApiId: !Ref MonitoringAPI
          Stage: prod

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref MonitoringAPIKey
      KeyType: API_KEY
      UsagePlanId: !Ref MonitoringUsagePlan

  # ── Lambda permissions for API Gateway ─────────────────────

  IngestorAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MonitoringAPI}/*/*'

  GroundTruthAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GroundTruthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MonitoringAPI}/*/*'

  ModelConfigAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModelConfigFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MonitoringAPI}/*/*'

  # ═══════════════════════════════════════════════════════════
  # EVENTBRIDGE SCHEDULERS
  # ═══════════════════════════════════════════════════════════

  DriftDetectorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: drift-detector-5min
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: DriftDetectorTarget
          Arn: !GetAtt DriftDetectorFunction.Arn

  DriftDetectorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DriftDetectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DriftDetectorRule.Arn

  AnomalyDetectorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: anomaly-detector-15min
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: AnomalyDetectorTarget
          Arn: !GetAtt AnomalyDetectorFunction.Arn

  AnomalyDetectorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnomalyDetectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AnomalyDetectorRule.Arn

  AccuracyPublisherRule:
    Type: AWS::Events::Rule
    Properties:
      Name: accuracy-publisher-15min
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: AccuracyPublisherTarget
          Arn: !GetAtt AccuracyPublisherFunction.Arn

  AccuracyPublisherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AccuracyPublisherFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AccuracyPublisherRule.Arn

  ReportGeneratorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: report-generator-daily
      ScheduleExpression: cron(0 0 * * ? *)
      State: ENABLED
      Targets:
        - Id: ReportGeneratorTarget
          Arn: !GetAtt ReportGeneratorFunction.Arn

  ReportGeneratorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportGeneratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReportGeneratorRule.Arn

  # ═══════════════════════════════════════════════════════════
  # CLOUDWATCH — Dashboard + Alarms
  # ═══════════════════════════════════════════════════════════

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: MLMonitoringDashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,
             "properties":{"metrics":[["MLMonitoring","AverageConfidence"]],"title":"Average Confidence Score","period":3600,"stat":"Average","region":"${AWS::Region}","view":"timeSeries"}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,
             "properties":{"metrics":[["MLMonitoring","PSIScore"]],"title":"PSI Drift Score (>0.2 = significant)","period":3600,"stat":"Average","region":"${AWS::Region}","view":"timeSeries"}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,
             "properties":{"metrics":[["MLMonitoring","PredictionVolume"]],"title":"Prediction Volume per 15 min","period":900,"stat":"Sum","region":"${AWS::Region}","view":"timeSeries"}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,
             "properties":{"metrics":[["MLMonitoring","ModelAccuracy"]],"title":"Ground Truth Accuracy","period":3600,"stat":"Average","region":"${AWS::Region}","view":"timeSeries"}},
            {"type":"metric","x":0,"y":12,"width":12,"height":6,
             "properties":{"metrics":[["MLMonitoring","KinesisProcessed"],["MLMonitoring","KinesisFailed"]],"title":"Kinesis Throughput","period":300,"stat":"Sum","region":"${AWS::Region}","view":"timeSeries"}}
          ]
        }

  LowConfidenceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: LowModelConfidence
      MetricName: AverageConfidence
      Namespace: MLMonitoring
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.75
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

  HighPSIAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: HighPSIDriftScore
      MetricName: PSIScore
      Namespace: MLMonitoring
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.2
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic
      TreatMissingData: notBreaching

# ═══════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════

Outputs:
  APIEndpoint:
    Description: Base API URL
    Value: !Sub 'https://${MonitoringAPI}.execute-api.${AWS::Region}.amazonaws.com/prod'

  PredictionsEndpoint:
    Description: POST predictions here
    Value: !Sub 'https://${MonitoringAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/predictions'

  GroundTruthEndpoint:
    Description: POST ground truth labels here
    Value: !Sub 'https://${MonitoringAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/ground-truth'

  ModelConfigEndpoint:
    Description: GET/POST per-model config
    Value: !Sub 'https://${MonitoringAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/models/{model_id}/config'

  KinesisStreamName:
    Description: Kinesis stream for high-volume ingestion
    Value: !Ref PredictionsStream

  StateMachineArn:
    Description: Step Functions drift response workflow
    Value: !Ref DriftResponseStateMachine

  DashboardURL:
    Description: CloudWatch Dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=MLMonitoringDashboard'

  S3Bucket:
    Description: Daily reports bucket
    Value: !Ref ReportsBucket

  APIKeyId:
    Description: API Key ID (get value from AWS Console → API Gateway → API Keys)
    Value: !Ref MonitoringAPIKey
